global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity", "id_medidor"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  receiver: "mlops-default"
  routes:
    - match:
        severity: P1
      receiver: "pagerduty-fiscal-critical"
      continue: true
    - match:
        severity: P2
      receiver: "slack-mlops-alerts"

receivers:
  - name: "mlops-default"
    webhook_configs:
      - url: "http://localhost:8000/admin/webhook-alert"
        send_resolved: true

  - name: "pagerduty-fiscal-critical"
    webhook_configs:
      - url: "${PAGERDUTY_WEBHOOK_URL}"
        send_resolved: true

  - name: "slack-mlops-alerts"
    webhook_configs:
      - url: "${SLACK_WEBHOOK_URL}"
        send_resolved: true
